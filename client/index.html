<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6b64" />
    <meta name="description" content="SlotDrop: pick the exact time your parcel is handed over." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SlotDrop</title>
    <!-- Apply the saved/system theme before first paint to avoid a light flash in dark mode -->
    <script>
      (function () {
        var t = localStorage.getItem('slotdrop-theme');
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
